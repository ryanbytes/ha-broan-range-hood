name: NFSS-70 Cavitation Sweep

on:
  push:
    branches: [nfss70-cfd]
    paths:
      - '.github/workflows/nfss70-cavitation.yml'
      - 'nfss70/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/nfss70-cavitation.yml'
      - 'nfss70/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cavitation:
    name: sigma-${{ matrix.sigma }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        sigma: ['0.15', '0.19', '0.23', '0.30']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenFOAM 14
        shell: bash
        run: |
          set -eo pipefail
          sudo apt-get update
          sudo apt-get install -y wget software-properties-common
          sudo add-apt-repository -y universe
          sudo sh -c "wget -O - https://dl.openfoam.org/gpg.key > /etc/apt/trusted.gpg.d/openfoam.asc"
          sudo rm -f /etc/apt/sources.list.d/*dl_openfoam_org*list
          sudo add-apt-repository -y "http://dl.openfoam.org/ubuntu main dev"
          sudo apt-get update
          sudo apt-get install -y openfoam14
          . /opt/openfoam14/etc/bashrc
          foamRun -help >/dev/null
          echo "OpenFOAM=$WM_PROJECT_VERSION"

      - name: Prepare 70-knot cavitation validation case
        shell: bash
        env:
          SIGMA: ${{ matrix.sigma }}
        run: |
          set -eo pipefail
          . /opt/openfoam14/etc/bashrc
          mkdir -p run
          CASE="$GITHUB_WORKSPACE/run/sigma_${SIGMA}"
          cp -a "$FOAM_TUTORIALS/incompressibleVoF/cavitatingBullet" "$CASE"
          cd "$CASE"
          cp 0/U.orig 0/U
          cp 0/p_rgh.orig 0/p_rgh

          python3 - <<'PY'
          import os, re, pathlib
          sigma = float(os.environ['SIGMA'])
          V = 36.011
          rho = 1025.0
          nu = 1.05e-6
          p_sat = 2300.0
          q = 0.5*rho*V*V
          p_inf = p_sat + sigma*q

          def patch(path, subs):
              p = pathlib.Path(path)
              s = p.read_text()
              for pattern, repl in subs:
                  s, n = re.subn(pattern, repl, s, flags=re.M)
                  if n == 0:
                      raise RuntimeError(f'Pattern not found in {path}: {pattern}')
              p.write_text(s)

          patch('0/U', [
              (r'internalField\s+uniform\s+\(0\s+0\s+20\);',
               f'internalField   uniform (0 0 {V:.6f});')
          ])
          patch('0/p_rgh', [
              (r'internalField\s+uniform\s+100000;',
               f'internalField   uniform {p_inf:.6f};')
          ])
          patch('constant/physicalProperties.water', [
              (r'nu\s+9e-07;', f'nu              {nu:.9g};'),
              (r'rho\s+1000;', f'rho             {rho:.9g};')
          ])
          patch('system/controlDict', [
              (r'endTime\s+0\.05;', 'endTime                 0.01;')
          ])

          pathlib.Path('NFSS70_CASE.txt').write_text(
              f'sigma={sigma}\nV_mps={V}\nrho={rho}\nnu={nu}\n'
              f'pSat_Pa={p_sat}\nq_Pa={q}\npInf_Pa={p_inf}\n'
          )
          print(pathlib.Path('NFSS70_CASE.txt').read_text())
          PY

      - name: Run OpenFOAM cavitation case
        shell: bash
        env:
          SIGMA: ${{ matrix.sigma }}
        run: |
          set -eo pipefail
          . /opt/openfoam14/etc/bashrc
          cd "$GITHUB_WORKSPACE/run/sigma_${SIGMA}"
          bash Allrun

      - name: Summarize result
        if: always()
        shell: bash
        env:
          SIGMA: ${{ matrix.sigma }}
        run: |
          set +e
          . /opt/openfoam14/etc/bashrc
          cd "$GITHUB_WORKSPACE/run/sigma_${SIGMA}" || exit 0
          {
            cat NFSS70_CASE.txt 2>/dev/null
            echo
            echo "latest_time=$(foamListTimes -latestTime 2>/dev/null)"
            echo "disk_usage=$(du -sh . 2>/dev/null | awk '{print $1}')"
            echo
            echo '--- solver tail ---'
            tail -n 200 log.foamRun 2>/dev/null
          } > result-summary.txt
          cat result-summary.txt

      - name: Upload logs and summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfss70-cavitation-sigma-${{ matrix.sigma }}
          path: |
            run/sigma_${{ matrix.sigma }}/NFSS70_CASE.txt
            run/sigma_${{ matrix.sigma }}/result-summary.txt
            run/sigma_${{ matrix.sigma }}/log.*
          if-no-files-found: warn
          retention-days: 7
