name: NFSS-70 OpenFOAM Container Smoke

on:
  push:
    branches: [nfss70-cfd]
    paths:
      - '.github/workflows/nfss70-docker-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/nfss70-docker-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Pull OpenFOAM 14 image
        run: docker pull microfluidica/openfoam:14
      - name: Verify solver and tutorial
        run: |
          docker run --rm microfluidica/openfoam:14 bash -lc '
            echo "OpenFOAM=$WM_PROJECT_VERSION"
            foamRun -help >/dev/null
            test -d "$FOAM_TUTORIALS/incompressibleVoF/cavitatingBullet"
            echo "tutorial=$FOAM_TUTORIALS/incompressibleVoF/cavitatingBullet"
          '
