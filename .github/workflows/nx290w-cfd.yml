name: NX-290W CFD

on:
  push:
    branches: [nx290w-cfd-runner]
    paths:
      - 'nx290w-cfd/**'
      - '.github/workflows/nx290w-cfd.yml'
  pull_request:
    branches: [main]
    paths:
      - 'nx290w-cfd/**'
      - '.github/workflows/nx290w-cfd.yml'
  workflow_dispatch:

jobs:
  cfd60:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    container:
      image: microfluidica/openfoam:14
    env:
      NX290W_NPROC: "2"
      NX290W_ENDTIME: "600"
    steps:
      - uses: actions/checkout@v4

      - name: Identify OpenFOAM
        shell: bash
        run: |
          echo "WM_PROJECT_DIR=${WM_PROJECT_DIR:-unset}"
          command -v foamRun || true
          command -v blockMesh || true
          nproc
          free -h

      - name: Generate 1:50 NX-290W geometry
        shell: bash
        run: |
          python3 nx290w-cfd/generate_stl.py
          ls -lh nx290w-cfd/DTC-scaled.stl

      - name: Run 60-knot free-surface CFD
        shell: bash
        run: |
          chmod +x nx290w-cfd/run_case.sh
          chmod +x nx290w-cfd/overlay/Allmesh nx290w-cfd/overlay/Allrun
          nx290w-cfd/run_case.sh 60

      - name: Collect results
        if: always()
        shell: bash
        run: |
          mkdir -p nx290w-cfd/artifact
          cp -f nx290w-cfd/runs/NX290W_60kn_1to50/NX290W_summary.txt nx290w-cfd/artifact/ 2>/dev/null || true
          cp -f nx290w-cfd/runs/NX290W_60kn_1to50/NX290W_60kn.log nx290w-cfd/artifact/ 2>/dev/null || true
          cp -rf nx290w-cfd/runs/NX290W_60kn_1to50/postProcessing nx290w-cfd/artifact/ 2>/dev/null || true
          find nx290w-cfd/artifact -maxdepth 4 -type f -ls || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nx290w-cfd-60kn
          path: nx290w-cfd/artifact
          retention-days: 7
