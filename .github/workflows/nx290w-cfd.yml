name: NX290W CFD Run
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  cfd:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenFOAM 14
        shell: bash
        run: |
          set -euxo pipefail
          sudo wget -qO /etc/apt/trusted.gpg.d/openfoam.asc https://dl.openfoam.org/gpg.key
          sudo add-apt-repository -y "http://dl.openfoam.org/ubuntu main dev"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openfoam14
      - name: Run NX-290W 60-knot double-body RANS
        shell: bash
        run: bash cfd/run_nx290w.sh
      - name: Upload CFD evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nx290w-cfd-60kn
          path: |
            nx290w/nx290w_summary.txt
            nx290w/log.*
            nx290w/postProcessing/**
            nx290w/constant/polyMesh/**
          retention-days: 7
