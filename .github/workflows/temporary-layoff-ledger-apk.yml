name: Temporary Layoff Ledger APK

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    if: github.head_ref == 'build/layoff-ledger-apk'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Ensure Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Restore Android source
        run: |
          mkdir -p /tmp/layoff-ledger
          base64 -d tmp/layoff-ledger-build/android-src.zip.b64 > /tmp/layoff-ledger/android-src.zip
          cd /tmp/layoff-ledger
          unzip -q android-src.zip -d android

      - name: Build debug APK
        working-directory: /tmp/layoff-ledger/android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: layoff-ledger-debug-apk
          path: /tmp/layoff-ledger/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
