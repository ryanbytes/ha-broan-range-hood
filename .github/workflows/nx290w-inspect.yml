name: NX-290W OpenFOAM Inspect

on:
  push:
    branches: [nx290w-cfd-runner]
    paths:
      - '.github/workflows/nx290w-inspect.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: microfluidica/openfoam:14
    steps:
      - uses: actions/checkout@v4
      - name: Dump DTC tutorial configuration
        shell: bash
        run: |
          source /opt/openfoam14/etc/bashrc
          CASE="$FOAM_TUTORIALS/incompressibleVoF/DTCHull"
          echo "CASE=$CASE"
          echo '===== Allmesh ====='
          cat "$CASE/Allmesh"
          echo '===== Allrun ====='
          cat "$CASE/Allrun"
          for f in system/refineMeshDict system/snappyHexMeshDict system/controlDict system/decomposeParDict; do
            echo "===== $f ====="
            cat "$CASE/$f"
          done
